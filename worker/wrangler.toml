# Deploy from this folder with:  npx wrangler deploy
name = "language-buddy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Keep the variables set in the Cloudflare dashboard (ALLOWED_ORIGIN, GEMINI_MODEL)
# instead of replacing them on every deploy.
keep_vars = true
preview_urls = false

# Run in the US. When the Worker ran in Asia, Gemini often rejected Cloudflare's
# outgoing IP with "User location is not supported".
[placement]
region = "aws:us-east-1"

[observability]
enabled = true

# "Buddy messages first": push subscriptions and pending messages.
[[kv_namespaces]]
binding = "BUDDY"
id = "ac833d27c435440eacd64d2abd7eaa79"

# The cron calls this Worker's own fetch handler through SELF, so the Gemini request
# runs where [placement] puts it (cron runs elsewhere).
[[services]]
binding = "SELF"
service = "language-buddy"

# Per-IP limit for all app requests (the Origin header alone can be faked).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

[triggers]
crons = ["*/10 * * * *"]   # keep in sync with CRON_MINUTES in worker.js

# Secrets never go in this file:
#   npx wrangler secret put GEMINI_API_KEY
#   node make-vapid.mjs | npx wrangler secret put VAPID_PRIVATE_JWK
#   npx wrangler secret put INTERNAL_KEY   (any long random string)
#   npx wrangler secret put ACCESS_CODE    (optional; then enter the same code in the app settings)

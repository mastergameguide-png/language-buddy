# Deploy from this folder with:  npx wrangler deploy
name = "language-buddy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Keep the variables set in the Cloudflare dashboard (ALLOWED_ORIGIN, GEMINI_MODEL)
# instead of replacing them on every deploy.
keep_vars = true
preview_urls = false

# Run in the US. When the Worker ran in Asia, Gemini often rejected Cloudflare's
# outgoing IP with "User location is not supported".
[placement]
region = "aws:us-east-1"

[observability]
enabled = true

# The API key is a secret and never goes in this file:
#   npx wrangler secret put GEMINI_API_KEY

# Only needed if you deploy from the command line with `npx wrangler deploy`.
# Deploying by copy-pasting worker.js in the Cloudflare dashboard does not use this file.
name = "language-buddy"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Change to your GitHub Pages address, e.g. "https://yourname.github.io"
ALLOWED_ORIGIN = "*"

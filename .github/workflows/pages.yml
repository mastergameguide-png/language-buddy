# Deploys the app to GitHub Pages on every push to main.
# Before publishing, the cache name in sw.js is replaced with the short commit SHA, so every
# release gets a new offline cache and phones pick it up. The repo keeps 'buddy-v23' as is:
# opening the app locally needs no Action.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/run-all.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the cache version with the commit SHA
        run: |
          sha="${GITHUB_SHA::7}"
          sed -i -E "s/^const CACHE = '[^']*';/const CACHE = 'buddy-${sha}';/" sw.js
          grep -n "^const CACHE = 'buddy-${sha}';" sw.js
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.json og-image.png css js icons assets vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
